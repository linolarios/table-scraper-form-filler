<!DOCTYPE html>
<html>
<head><title>Table Test</title></head>
<body>
<h2>1. Colspan test</h2>
<table id="colspan-test" border="1">
    <thead>
    <tr>
        <th colspan="2">Wide Header</th>
        <th>Price</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>Apples</td>
        <td>$2</td>
        <td>$1.50</td>
    </tr>
    <tr>
        <td>Bananas</td>
        <td>$3</td>
        <td>$2.50</td>
    </tr>
    </tbody>
</table>

<h2>2. Rowspan test</h2>
<table id="rowspan-test" border="1">
    <thead>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td rowspan="2">Alice</td>
        <td>alice@x.com</td>
        <td>Admin</td>
    </tr>
    <tr>
        <td>bob@x.com</td>
        <td>User</td>
    </tr>
    </tbody>
</table>

<h2>3. Combined colspan + rowspan</h2>
<table id="combined-test" border="1">
    <thead>
    <tr>
        <th>Item</th>
        <th colspan="2">Details</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td rowspan="2" colspan="2">Big Cell</td>
        <td>C1</td>
    </tr>
    <tr>
        <td>C2</td>
    </tr>
    </tbody>
</table>
</body>
</html>
